name: "01 — Fetch pmOS base"

on:
  workflow_dispatch:
    inputs:
      artifact_url:
        description: "Direct download URL (skip PAT)"
        default: ""
      source_run:
        description: "Build # from begonia-postmarketos-build"
        default: "25"

env:
  PAT: ${{ secrets.PMOS_PAT }}

jobs:
  fetch:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            android-sdk-platform-tools-common \
            e2fsprogs f2fs-tools \
            --no-install-recommends

      - name: Download artifact
        run: |
          if [ -n "${{ inputs.artifact_url }}" ]; then
            echo "Downloading from provided URL..."
            curl -sL -o pmos.zip "${{ inputs.artifact_url }}"
          elif [ -n "${{ env.PAT }}" ]; then
            echo "Auto-downloading from run #${{ inputs.source_run }}..."
            echo "${{ env.PAT }}" | gh auth login --with-token 2>/dev/null || true
            # Resolve run number to database ID
            echo "Resolving run number ${{ inputs.source_run }}..."
            RUN_ID=$(gh run list --repo criollojoel10/begonia-postmarketos-build --limit 100 --json databaseId,number -q ".[] | select(.number == ${{ inputs.source_run }}) | .databaseId" | head -1)
            if [ -z "$RUN_ID" ]; then
              echo "Could not resolve run #${{ inputs.source_run }}, trying as database ID..."
              RUN_ID="${{ inputs.source_run }}"
            fi
            echo "Run database ID: $RUN_ID"
            gh run download "$RUN_ID" \
              --repo criollojoel10/begonia-postmarketos-build \
              --name pmos-begonia-console-cross-true \
              --dir pmos-raw 2>&1
            cd pmos-raw && zip -r ../pmos.zip . && cd ..
          else
            echo "ERROR: provide artifact_url input or set PMOS_PAT secret"
            echo ""
            echo "How to get the artifact URL:"
            echo "1. Go to https://github.com/criollojoel10/begonia-postmarketos-build/actions/runs/28313265908"
            echo "2. Download 'pmos-begonia-console-cross-true' manually"
            echo "3. Upload to any public file host and pass URL, OR"
            echo "4. Create a PAT with 'repo' scope, save as repo secret PMOS_PAT"
            exit 1
          fi
          ls -lh pmos.zip
          unzip -l pmos.zip | head -15

      - name: Extract files
        run: |
          mkdir -p pmos out
          unzip -o pmos.zip -d pmos/
          EXDIR=$(find pmos -type d -name "export" | head -1)
          [ -z "$EXDIR" ] && EXDIR="pmos"
          echo "Source: $EXDIR"
          if [ -f "$EXDIR/boot.img" ]; then
            cp "$EXDIR/boot.img" out/boot.img
            file out/boot.img
          fi
          if [ -f "$EXDIR/vmlinuz" ]; then
            cp "$EXDIR/vmlinuz" out/vmlinuz
          fi
          for f in "$EXDIR/initramfs" "$EXDIR/initramfs.gz" "$EXDIR/initrd.img"; do
            if [ -f "$f" ]; then
              cp "$f" out/initramfs
              break
            fi
          done
          echo "out/: $(ls -lh out/)"

      - name: Mount and extract modules + firmware
        run: |
          # The xiaomi-begonia.img is a raw ext4 filesystem image (no partitions)
          SYSIMG=$(find pmos -name "xiaomi-begonia.img" | head -1)
          if [ -z "$SYSIMG" ]; then
            echo "ERROR: no system image found"
            find pmos -type f -exec ls -lh {} \;
            exit 1
          fi
          echo "System image: $(ls -lh $SYSIMG)"
          
          # Convert sparse to raw if needed
          if file "$SYSIMG" | grep -q "sparse"; then
            echo "Converting sparse image..."
            simg2img "$SYSIMG" system-raw.img
            ls -lh system-raw.img
          else
            cp "$SYSIMG" system-raw.img
          fi
          
          # Mount directly (no kpartx - this is a filesystem image, not a disk)
          mkdir -p mnt
          sudo mount -o loop,ro system-raw.img mnt
          
          echo "=== Mounted at mnt/ ==="
          ls mnt/
          
          # Extract modules
          if [ -d mnt/lib/modules ]; then
            KVER=$(ls mnt/lib/modules/ | head -1)
            echo "Found kernel modules: $KVER"
            sudo tar -czf out/modules.tar.gz -C mnt/lib modules
            ls -lh out/modules.tar.gz
          else
            echo "No modules found in mnt/lib/modules"
            ls mnt/lib/ 2>/dev/null || echo "lib/ not found"
          fi
          
          # Extract firmware
          if [ -d mnt/lib/firmware ]; then
            sudo tar -czf out/firmware.tar.gz -C mnt/lib firmware
            ls -lh out/firmware.tar.gz
          else
            echo "No firmware found"
          fi
          
          sudo umount mnt
          echo ""
          echo "=== Final output ==="
          ls -lh out/

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: pmos-base-begonia
          path: out/
          retention-days: 90
