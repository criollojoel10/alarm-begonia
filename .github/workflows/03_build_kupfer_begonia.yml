name: "03 — Build Kupfer Linux for begonia (WiFi: rtl8xxxu + UNTESTED)"

on:
  workflow_dispatch:
    inputs:
      rootfs_size:
        description: "Rootfs image size (GB)"
        default: "8"

permissions:
  contents: write

env:
  ARCH_ROOTFS_URL: "http://os.archlinuxarm.org/os/ArchLinuxARM-aarch64-latest.tar.gz"
  KERNEL_REPO: "https://gitlab.postmarketos.org/mt6785-mainline/linux.git"
  KERNEL_TAG: "6.16.4-r0"
  KERNEL_CONFIG_URL: "https://gitlab.postmarketos.org/postmarketOS/pmaports/-/raw/master/device/testing/linux-postmarketos-mediatek-mt6785/config-postmarketos-mediatek-mt6785.aarch64"
  DEVICEINFO_URL: "https://gitlab.postmarketos.org/postmarketOS/pmaports/-/raw/master/device/testing/device-xiaomi-begonia/deviceinfo"

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4

      - name: Install deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            libarchive-tools xz-utils zstd e2fsprogs \
            qemu-user-static binfmt-support \
            gcc-aarch64-linux-gnu python3 \
            --no-install-recommends

      # ============================================================
      # Get pmOS base artifact (kernel + modules + DTB from build #22)
      # ============================================================
      - name: Download pmOS base
        uses: dawidd6/action-download-artifact@v9
        with:
          name: pmos-base-begonia
          path: pmos-base
          workflow: 01_build_pmos_base.yml
          workflow_conclusion: success
          workflow_search: true
          check_artifacts: true
          repo: criollojoel10/alarm-begonia
        continue-on-error: true

      # Fallback: try to find any boot.img from previous runs
      - name: Fallback — find boot.img from other artifacts
        if: failure()
        run: |
          echo "⚠️ No artifact from workflow 01, trying alternative sources..."
          mkdir -p pmos-base
          curl -sL -o boot-nightly.img \
            'https://github.com/criollojoel10/alarm-begonia/releases/download/nightly/boot-begonia-arch.img' \
            2>/dev/null && {
            echo 'Downloaded boot.img from nightly release'
            cp boot-nightly.img pmos-base/boot.img
          } || {
            echo 'No boot.img found from any source — will try to extract kernel from chroot'
          }

      - name: Check pmOS base
        run: |
          echo "=== pmos-base contents ==="
          ls -lh pmos-base/ 2>/dev/null || mkdir -p pmos-base
          if [ -f pmos-base/boot.img ]; then
            echo "✅ boot.img found: $(ls -lh pmos-base/boot.img | awk '{print $5}')"
          else
            echo "⚠️ No boot.img in artifact"
          fi
          echo "---"
          find pmos-base/ -type f 2>/dev/null | sort

      - name: Download Arch rootfs
        run: |
          wget -q --show-progress "${{ env.ARCH_ROOTFS_URL }}" -O arch-rootfs.tar.gz
          ls -lh arch-rootfs.tar.gz

      # ============================================================
      # Create rootfs with label 'kupfer_root' (Kupfer convention)
      # ============================================================
      - name: Create and mount rootfs (kupfer_root)
        run: |
          truncate -s ${{ inputs.rootfs_size }}G rootfs.img
          mkfs.ext4 -F -L kupfer_root rootfs.img
          mkdir -p mnt
          sudo mount rootfs.img mnt

      - name: Extract Arch rootfs
        run: |
          sudo bsdtar -xpf arch-rootfs.tar.gz -C mnt
          echo "Rootfs size:"
          df -h mnt

      # ============================================================
      # Inject pmOS kernel modules + firmware
      # Fix #1: extraer modules.tar.gz (no modules-begonia.tar.gz)
      # ============================================================
      - name: Inject pmOS modules + firmware
        run: |
          sudo mkdir -p mnt/usr/lib

          # Extraer módulos pmOS 6.16.4
          if [ -f pmos-base/modules.tar.gz ]; then
            echo "Extracting pmOS modules.tar.gz..."
            sudo tar -xzf pmos-base/modules.tar.gz -C mnt/usr/lib/
          else
            echo "ERROR: pmos-base/modules.tar.gz not found"
            find pmos-base/ -type f 2>/dev/null || true
            exit 1
          fi

          # Extraer firmware pmOS
          if [ -f pmos-base/firmware.tar.gz ]; then
            echo "Extracting pmOS firmware.tar.gz..."
            sudo mkdir -p mnt/usr/lib/firmware
            sudo tar -xzf pmos-base/firmware.tar.gz -C mnt/usr/lib/firmware/ 2>/dev/null || \
            sudo tar -xzf pmos-base/firmware.tar.gz -C mnt/
          fi

          echo "=== Available module trees ==="
          find mnt/usr/lib/modules -maxdepth 1 -mindepth 1 -type d -printf '%f\n'

          # Forzar KVER a 6.x — fallar si no se encuentra
          KVER=$(find mnt/usr/lib/modules -maxdepth 1 -mindepth 1 -type d -printf '%f\n' | grep '^6\.' | head -1)
          if [ -z "$KVER" ]; then
            echo "ERROR: pmOS 6.x module tree not found"
            find mnt/usr/lib/modules -maxdepth 1 -mindepth 1 -type d -printf '%f\n' || true
            exit 1
          fi
          echo "KVER=$KVER" >> $GITHUB_ENV
          echo "Target kernel: $KVER"

      # ============================================================
      # Generate boot.img CMDLINE for Kupfer
      # Fix #4: cmdline de debug (sin quiet/splash, con loglevel=7)
      # ============================================================
      - name: Generate Kupfer cmdline
        run: |
          # Heredar parámetros del deviceinfo pmOS si existen
          # Para debug: sin quiet/splash/plymouth
          KUPFER_CMDLINE="root=LABEL=kupfer_root rw rootwait rootfstype=ext4 loglevel=7 ignore_loglevel bootopt=64S3,32N2,64N2"

          mkdir -p boot-build
          echo "$KUPFER_CMDLINE" > boot-build/cmdline.txt
          echo "Kupfer cmdline: $KUPFER_CMDLINE"

      # ============================================================
      # Chroot: preparar y bloquear linux-aarch64 (Fix #2)
      # ============================================================
      - name: Prepare chroot
        run: |
          sudo cp "$(which qemu-aarch64-static)" mnt/usr/bin/
          sudo mount -t proc proc mnt/proc
          sudo mount --bind /sys mnt/sys
          sudo mount --bind /dev mnt/dev
          sudo mount --bind /dev/pts mnt/dev/pts 2>/dev/null || true
          sudo rm -f mnt/etc/resolv.conf
          sudo bash -c 'cp /etc/resolv.conf mnt/etc/resolv.conf'
          # Fix #2: bloquear linux-aarch64 para que pacman no lo instale/actualice
          sudo sed -i '/^\[options\]/a IgnorePkg = linux-aarch64' mnt/etc/pacman.conf
          sudo sed -i '/^\[options\]/a DisableSandbox' mnt/etc/pacman.conf 2>/dev/null || true

      - name: Install base packages (pacman)
        run: |
          sudo chroot mnt /bin/bash -c '
            pacman-key --init 2>&1
            pacman-key --populate archlinuxarm 2>&1
            pacman -Syu --noconfirm --needed \
              busybox \
              sudo vim nano git openssh rsync curl wget \
              networkmanager iwd wpa_supplicant \
              mkinitcpio mkinitcpio-busybox \
              htop tmux linux-firmware 2>&1
          '

      # Fix #2 (cont): remover linux-aarch64 si se coló via dependencia
      - name: Remove stray linux-aarch64
        run: |
          sudo chroot mnt /bin/bash -c '
            pacman -Rns --noconfirm linux-aarch64 2>&1 || true
            echo "=== Remaining module trees ==="
            ls /usr/lib/modules/ 2>/dev/null || echo "(none)"
          '

      # ============================================================
      # Install Kupfer mkinitcpio hooks (custom port)
      # ============================================================
      - name: Install Kupfer initramfs hooks
        run: |
          sudo mkdir -p mnt/etc/kupfer/mkinitcpio.conf.d
          sudo mkdir -p mnt/usr/lib/initcpio/hooks
          sudo mkdir -p mnt/usr/lib/initcpio/install

          # Kupfer rootfsdetect hook
          sudo tee mnt/usr/lib/initcpio/hooks/rootfsdetect > /dev/null << 'RFSH'
          run_hook() {
            export rwopt=rw
            export init=/sbin/init

            if [ -n "$root" ] && [ "$root" != "LABEL=kupfer_root" ]; then
              [ -b "$root" ] && return 0
            fi

            echo "Kupfer: Searching for kupfer_root..."
            if [ -e "/dev/disk/by-label/kupfer_root" ]; then
              export root="/dev/disk/by-label/kupfer_root"
              echo "Kupfer: Found root at $root"
              return 0
            fi

            for part in /dev/sd?[0-9]* /dev/mmcblk[0-9]p* /dev/vd?[0-9]*; do
              [ -b "$part" ] || continue
              label=$(blkid -o value -s LABEL "$part" 2>/dev/null)
              if [ "$label" = "kupfer_root" ]; then
                export root="$part"
                echo "Kupfer: Found kupfer_root at $part"
                return 0
              fi
            done

            echo "Kupfer: WARNING - kupfer_root not found"
          }
          RFSH

          sudo tee mnt/usr/lib/initcpio/install/rootfsdetect > /dev/null << 'RFSI'
          build() {
            add_runscript
            add_binary /usr/bin/blkid /usr/bin/blkid
            add_binary /sbin/blkid /sbin/blkid 2>/dev/null || true
          }
          help() {
            echo "Detect root partition with label kupfer_root"
          }
          RFSI

          sudo chmod 755 mnt/usr/lib/initcpio/hooks/rootfsdetect mnt/usr/lib/initcpio/install/rootfsdetect

      # ============================================================
      # Create Kupfer mkinitcpio config
      # Fix #3: sin autodetect (CI no tiene hardware begonia), gzip en vez de zstd
      # ============================================================
      - name: Configure mkinitcpio (Kupfer-style)
        run: |
          cat > /tmp/mkinitcpio.conf << 'MKINIT'
          # mkinitcpio.conf — Kupfer Linux on begonia
          # NOTA: sin autodetect — CI runner no tiene hardware begonia
          MODULES=(ext4 mmc_block)
          BINARIES=(/usr/bin/blkid)
          FILES=()
          HOOKS=(base udev modconf block rootfsdetect filesystems fsck)
          COMPRESSION="gzip"
          MKINITCPIO_BUSYBOX=1
          MKINITCPIO_QUIET=1
          MKINIT
          sudo cp /tmp/mkinitcpio.conf mnt/etc/mkinitcpio.conf

          # Device-specific config
          sudo mkdir -p mnt/etc/kupfer/mkinitcpio.conf.d
          cat > /tmp/begonia.conf << 'BEG'
          MODULES+=(mtk_sd)
          BINARIES+=(/usr/bin/losetup)
          BEG
          sudo cp /tmp/begonia.conf mnt/etc/kupfer/mkinitcpio.conf.d/begonia.conf

          echo "mkinitcpio configured:"
          cat mnt/etc/mkinitcpio.conf

      # ============================================================
      # Install Kupfer deviceinfo
      # ============================================================
      - name: Install deviceinfo
        run: |
          wget -q "${{ env.DEVICEINFO_URL }}" -O /tmp/deviceinfo
          sudo mkdir -p mnt/etc/kupfer
          sudo cp /tmp/deviceinfo mnt/etc/kupfer/deviceinfo
          echo "Deviceinfo installed:"
          cat mnt/etc/kupfer/deviceinfo

      # ============================================================
      # Build rtl8xxxu with CONFIG_RTL8XXXU_UNTESTED=y
      # ============================================================
      - name: Restore kernel source cache
        id: cache-kernel
        uses: actions/cache@v4
        with:
          path: linux-kernel
          key: v1-kernel-6.16.4-r0

      - name: Clone kernel source
        if: steps.cache-kernel.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --branch ${{ env.KERNEL_TAG }} \
            ${{ env.KERNEL_REPO }} linux-kernel 2>&1 | tail -3

      - name: Prepare kernel build tree (with RTL8XXXU_UNTESTED)
        run: |
          wget -q "${{ env.KERNEL_CONFIG_URL }}" -O linux-kernel/.config
          cd linux-kernel
          sed -i 's/^CONFIG_RTL8XXXU=y/# CONFIG_RTL8XXXU is not set/' .config
          for line in \
            "CONFIG_WLAN_VENDOR_REALTEK=y" \
            "CONFIG_RTL8XXXU=m" \
            "CONFIG_RTL8XXXU_UNTESTED=y"; do
            opt="${line%%=*}"
            sed -i "s/^# ${opt} is not set/${line}/" .config 2>/dev/null || true
            grep -q "^${line}" .config || echo "$line" >> .config
          done
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- olddefconfig 2>&1 | tail -3
          echo "=== RTL config verification ==="
          grep -E "CONFIG_WLAN_VENDOR_REALTEK=|CONFIG_RTL8XXXU=." .config | head -3
          grep -q "CONFIG_RTL8XXXU_UNTESTED=y" .config && echo "✅ UNTESTED=y" || echo "⚠️ UNTESTED lost, adding after olddefconfig..."
          grep -q "CONFIG_RTL8XXXU_UNTESTED=y" .config || {
            echo "CONFIG_RTL8XXXU_UNTESTED=y" >> .config
            make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- olddefconfig 2>&1 | tail -2
            grep -q "CONFIG_RTL8XXXU_UNTESTED=y" .config && echo "  ✅ UNTESTED=y after retry" || echo "  ⚠️ STILL lost"
          }
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- modules_prepare 2>&1 | tail -5

      - name: Build rtl8xxxu module
        run: |
          KSRC="${{ github.workspace }}/linux-kernel"
          cd "$KSRC"
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- \
            KBUILD_MODPOST_WARN=1 \
            M=drivers/net/wireless/realtek/rtl8xxxu modules 2>&1 | tail -20
          echo "=== Built rtl8xxxu ==="
          find drivers/net/wireless/realtek/rtl8xxxu -name "*.ko" -exec ls -lh {} \;

      # Fix #4: instalar rtl8xxxu en el árbol pmOS 6.x (no Arch 7.x)
      - name: Install rtl8xxxu module + config
        run: |
          # KVER viene de $GITHUB_ENV (paso Inject pmOS modules), o forzar 6.x
          KVER=${KVER:-$(find mnt/usr/lib/modules -maxdepth 1 -mindepth 1 -type d -printf '%f\n' | grep '^6\.' | head -1)}
          if [ -z "$KVER" ]; then
            echo "ERROR: No pmOS 6.x kernel modules found"
            find mnt/usr/lib/modules -maxdepth 1 -mindepth 1 -type d -printf '%f\n' || true
            exit 1
          fi
          echo "Target kernel: $KVER"
          MODBASE="mnt/usr/lib/modules/$KVER/kernel/drivers/net/wireless/realtek/rtl8xxxu"

          RTLKO=$(find linux-kernel/drivers/net/wireless/realtek/rtl8xxxu -name "*.ko" | head -1)

          if [ -f "$RTLKO" ]; then
            sudo mkdir -p "$MODBASE"
            sudo cp "$RTLKO" "$MODBASE/"
            sudo depmod -b mnt "$KVER"
            echo "✅ rtl8xxxu.ko installed into $KVER (size: $(ls -lh $RTLKO | awk '{print $5}'))"
            echo "=== Vermagic check ==="
            modinfo "$RTLKO" | grep vermagic
            # Validar que vermagic contenga $KVER
            MAGIC=$(modinfo "$RTLKO" 2>/dev/null | grep vermagic | grep -o "$KVER" || echo "")
            if [ -n "$MAGIC" ]; then
              echo "✅ Vermagic matches $KVER"
            else
              echo "⚠️ Vermagic does NOT contain $KVER — module may not load"
            fi
          else
            echo "❌ rtl8xxxu.ko not produced"
            find linux-kernel/drivers/net/wireless/realtek/rtl8xxxu -type f | head -20
            exit 1
          fi

          # Blacklist broken 8192eu
          sudo mkdir -p mnt/etc/modprobe.d mnt/etc/modules-load.d
          echo 'blacklist 8192eu' | sudo tee mnt/etc/modprobe.d/blacklist-8192eu.conf > /dev/null
          echo 'rtl8xxxu' | sudo tee mnt/etc/modules-load.d/rtl8xxxu.conf > /dev/null
          echo "=== Config installed ==="
          cat mnt/etc/modprobe.d/blacklist-8192eu.conf
          cat mnt/etc/modules-load.d/rtl8xxxu.conf

      # ============================================================
      # /etc/fstab (Kupfer-style)
      # ============================================================
      - name: Create /etc/fstab
        run: |
          sudo tee mnt/etc/fstab > /dev/null << 'FSTAB'
          # /etc/fstab — Kupfer Linux on begonia
          LABEL=kupfer_root  /  ext4  rw,noatime,nodiratime,data=ordered  0 1
          tmpfs  /tmp  tmpfs  rw,nosuid,nodev,noexec,mode=1777  0 0
          FSTAB
          echo "✓ /etc/fstab:"
          cat mnt/etc/fstab

      # ============================================================
      # Generate Kupfer initramfs via mkinitcpio
      # Fix #5: forzar KVER a 6.x (pmOS), fallar si no se encuentra
      # ============================================================
      - name: Generate initramfs
        run: |
          KVER=$(find mnt/usr/lib/modules -maxdepth 1 -mindepth 1 -type d -printf '%f\n' | grep '^6\.' | head -1)
          if [ -z "$KVER" ]; then
            echo "ERROR: No pmOS 6.x kernel modules found"
            find mnt/usr/lib/modules -maxdepth 1 -mindepth 1 -type d -printf '%f\n' || true
            exit 1
          fi
          echo "Generating initramfs for kernel $KVER..."

          sudo tee mnt/tmp/gen-initramfs.sh > /dev/null << 'SCRIPT'
          #!/bin/bash
          # Fix #5: seleccionar kernel 6.x (pmOS), jamás 7.x (Arch)
          KVER="$(find /usr/lib/modules -maxdepth 1 -mindepth 1 -type d -printf '%f\n' | grep '^6\.' | head -1)"
          if [ -z "$KVER" ]; then
            echo "ERROR: no pmOS 6.x kernel modules found in chroot"
            find /usr/lib/modules -maxdepth 1 -mindepth 1 -type d -printf '%f\n'
            exit 1
          fi
          echo "Kernel in chroot: $KVER"
          mkinitcpio -k "$KVER" -g /boot/initramfs-kupfer.img 2>&1 || (
            echo "Direct call failed, trying with explicit hooks..."
            mkinitcpio -k "$KVER" -g /boot/initramfs-kupfer.img \
              -A rootfsdetect 2>&1
          )
          ls -lh /boot/initramfs-kupfer.img
          SCRIPT
          sudo chmod 755 mnt/tmp/gen-initramfs.sh

          sudo chroot mnt /bin/bash /tmp/gen-initramfs.sh

          echo "Initramfs result:"
          ls -lh mnt/boot/initramfs-kupfer.img 2>/dev/null || echo "❌ No initramfs found"
          ls -lh mnt/boot/initramfs-*.img 2>/dev/null || true

      # ============================================================
      # Copy boot files out of chroot
      # ============================================================
      - name: Copy boot files out of chroot
        run: |
          mkdir -p boot-out
          sudo cp mnt/boot/initramfs-kupfer.img boot-out/initramfs-kupfer.img 2>/dev/null || true
          sudo find mnt/boot/ -name "vmlinuz*" -o -name "Image*" 2>/dev/null | head -1 | xargs -r sudo cp -t boot-out/ 2>/dev/null || true
          # Copiar DTB desde módulos pmOS
          KVER=${KVER:-$(find mnt/usr/lib/modules -maxdepth 1 -mindepth 1 -type d -printf '%f\n' | grep '^6\.' | head -1)}
          if [ -n "$KVER" ]; then
            DTB_SRC=$(sudo find mnt/usr/lib/modules/$KVER/dtbs -name "*.dtb" 2>/dev/null | head -1)
            if [ -n "$DTB_SRC" ]; then
              sudo cp "$DTB_SRC" boot-out/mt6785-xiaomi-begonia.dtb
              echo "✅ DTB copied: $DTB_SRC"
            fi
          fi
          sudo chmod 644 boot-out/* 2>/dev/null || true
          echo "=== boot-out ==="
          ls -lh boot-out/ 2>/dev/null || echo "(empty)"

      # ============================================================
      # Build Kupfer boot.img
      # Fix #6: preservar DTB + header v2, verificar tamaño contra original
      # ============================================================
      - name: Build boot.img (Kupfer kernel + initramfs)
        run: |
          CMDLINE=$(cat boot-build/cmdline.txt)
          echo "Cmdline: $CMDLINE"

          INITRAMFS="boot-out/initramfs-kupfer.img"
          if [ ! -f "$INITRAMFS" ]; then
            echo "❌ No initramfs found at boot-out/"
            ls -lh boot-out/ 2>/dev/null || echo "boot-out/ empty"
            exit 1
          fi
          echo "Initramfs: $INITRAMFS ($(ls -lh $INITRAMFS | awk '{print $5}'))"

          PMOS_BOOT="pmos-base/boot.img"
          DTB_FILE="boot-out/mt6785-xiaomi-begonia.dtb"

          if [ -f "$PMOS_BOOT" ]; then
            echo "=== pmOS original boot.img size ==="
            ls -lh "$PMOS_BOOT"

            # Route A (preferida): repack con scripts/repack-bootimg.py
            echo "Route A: Repacking from pmOS boot.img"
            python3 scripts/repack-bootimg.py \
              "$PMOS_BOOT" \
              "$INITRAMFS" \
              "$CMDLINE" \
              boot-kupfer-begonia.img 2>&1

            echo "=== Repacked boot.img size ==="
            ls -lh boot-kupfer-begonia.img || echo "(not created)"
          fi

          # Si repack falló o no existe el boot.img pmOS, usar mkbootimg directo
          if [ ! -f "boot-kupfer-begonia.img" ] || [ ! -s "boot-kupfer-begonia.img" ]; then
            echo "Route B: Building boot.img from scratch with mkbootimg"
            KVER=${KVER:-$(find mnt/usr/lib/modules -maxdepth 1 -mindepth 1 -type d -printf '%f\n' | grep '^6\.' | head -1)}

            # Encontrar kernel image
            VMLINUZ=$(sudo find mnt/boot/ -name "vmlinuz*" -o -name "Image*" 2>/dev/null | head -1)
            if [ -z "$VMLINUZ" ]; then
              VMLINUZ=$(sudo find mnt/usr/lib/modules -name "Image*" -o -name "vmlinuz*" 2>/dev/null | head -1)
            fi
            if [ -z "$VMLINUZ" ]; then
              echo "Using pmOS boot.img kernel as fallback..."
              # Extraer kernel del boot.img pmOS si existe
              if [ -f "$PMOS_BOOT" ]; then
                # Extract kernel from pmOS boot.img via temp Python script
                cat > /tmp/extract-kernel.py << 'PYEOF'
                import struct, sys

                with open(sys.argv[1], 'rb') as f:
                    data = f.read()
                kernel_size = struct.unpack('<I', data[8:12])[0]
                kernel_offset = struct.unpack('<I', data[12:16])[0]
                with open(sys.argv[2], 'wb') as out:
                    out.write(data[kernel_offset:kernel_offset + kernel_size])
                print(f'Extracted kernel: {kernel_size} bytes')
                PYEOF
                python3 /tmp/extract-kernel.py "$PMOS_BOOT" boot-out/kernel.bin
                VMLINUZ="boot-out/kernel.bin"
              fi
            fi

            if [ -z "$VMLINUZ" ] || [ ! -f "$VMLINUZ" ]; then
              echo "❌ No kernel image found"
              exit 1
            fi
            echo "Kernel: $VMLINUZ ($(ls -lh $VMLINUZ | awk '{print $5}'))"

            # Build boot.img con mkbootimg
            pip3 install mkbootimg 2>/dev/null || true

            # Parámetros de begonia desde deviceinfo
            python3 -m mkbootimg \
              --kernel "$VMLINUZ" \
              --ramdisk "$INITRAMFS" \
              --cmdline "$CMDLINE" \
              --base 0x0 \
              --kernel_offset 0x00008000 \
              --ramdisk_offset 0x01000000 \
              --second_offset 0x00f00000 \
              --tags_offset 0x00000100 \
              --pagesize 2048 \
              --header_version 2 \
              $( [ -f "$DTB_FILE" ] && echo "--dtb $DTB_FILE" ) \
              --os_version 23.0.0 \
              --os_patch_level 2026-06 \
              -o boot-kupfer-begonia.img 2>&1 || {
                echo "❌ mkbootimg failed"
                exit 1
              }
          fi

          echo "=== boot.img ==="
          ls -lh boot-kupfer-begonia.img

          # Verificar cmdline
          cat > /tmp/verify-bootimg.py << 'PYEOF'
          import struct
          import sys
          with open(sys.argv[1], 'rb') as f:
              data = f.read(576)
          c = data[64:576].rstrip(b'\x00').decode('ascii', 'replace')
          print(f'Cmdline: {c}')
          print(f'kupfer_root: {"kupfer_root" in c} ✅')
          r_size = struct.unpack('<I', data[16:20])[0]
          print(f'Ramdisk size: {r_size:,} B')
          k_size = struct.unpack('<I', data[8:12])[0]
          print(f'Kernel size: {k_size:,} B')
          hdr_ver = struct.unpack('<I', data[36:40])[0]
          print(f'Header version: {hdr_ver}')
          print(f'Total size: {len(data):,} B')
          PYEOF
          python3 /tmp/verify-bootimg.py boot-kupfer-begonia.img

          # Comparar con original si existe
          if [ -f "$PMOS_BOOT" ]; then
            cat > /tmp/compare-bootimg.py << 'PYEOF'
          import os
          import sys
          orig = os.path.getsize(sys.argv[1])
          new = os.path.getsize(sys.argv[2])
          ratio = new / orig * 100
          print(f'Original pmOS boot.img: {orig:,} B')
          print(f'Kupfer boot.img:        {new:,} B')
          print(f'Ratio: {ratio:.1f}%')
          if ratio < 50:
              print('\u26a0\ufe0f boot.img es <50% del original \u2014 puede faltar DTB o secci\u00f3n recovery')
          elif ratio > 150:
              print('\u26a0\ufe0f boot.img es >150% del original \u2014 initramfs muy grande')
          else:
              print('\u2705 Tama\u00f1o razonable vs original')
          PYEOF
            python3 /tmp/compare-bootimg.py "$PMOS_BOOT" boot-kupfer-begonia.img
          fi

      # ============================================================
      # Enable services & user
      # ============================================================
      - name: Configure system
        run: |
          sudo chroot mnt /bin/bash -c '
            systemctl set-default multi-user.target
            systemctl enable sshd
            systemctl enable NetworkManager
            systemctl enable systemd-timesyncd
            useradd -m -s /bin/bash alarm 2>/dev/null || true
            echo "alarm:alarm" | chpasswd
            usermod -aG wheel alarm 2>/dev/null || true
            sed -i "s/# %wheel ALL=(ALL:ALL) ALL/%wheel ALL=(ALL:ALL) ALL/" /etc/sudoers
            echo "PermitRootLogin yes" >> /etc/ssh/sshd_config
          '

      # ============================================================
      # Release
      # ============================================================
      - name: Cleanup and compress
        run: |
          sudo umount mnt/dev/pts 2>/dev/null || true
          sudo umount mnt/dev 2>/dev/null || true
          sudo umount mnt/sys 2>/dev/null || true
          sudo umount mnt/proc 2>/dev/null || true
          sudo umount mnt 2>/dev/null || true

          mkdir -p release
          mv boot-kupfer-begonia.img release/
          xz -9 -T 0 -f rootfs.img
          mv rootfs.img.xz release/rootfs-kupfer-begonia-console.img.xz
          cd release && sha256sum * > SHA256SUMS.txt && ls -lh && cd ..

      - name: Create/Update Release
        uses: ncipollo/release-action@v1
        with:
          tag: kupfer-nightly
          name: "Kupfer Linux for begonia (nightly)"
          body: |
            ## Kupfer Linux for Xiaomi Redmi Note 8 Pro (begonia)

            **Arch Linux ARM + Kupfer initramfs + pmOS kernel**

            ### Fixes aplicados
            - ✅ Kernel/modules/initramfs coherentes (pmOS 6.16.4)
            - ✅ linux-aarch64 bloqueado (no más contaminación 7.x)
            - ✅ initramfs sin autodetect (gzip)
            - ✅ rtl8xxxu.ko instalado en árbol 6.x
            - ✅ boot.img preserva DTB + header v2
            - ✅ firmware pmOS extraído
            - ✅ Cmdline de debug (loglevel=7)

            ### Flujo de boot
            ```
            Bootloader → kernel pmOS 6.16.4 (mt6785 mainline)
            → mkinitcpio initramfs (Kupfer hooks)
            → busca kupfer_root por label
            → switch_root → systemd de Arch Linux ARM 🚀
            ```

            ### Install
            ```
            xz -d rootfs-kupfer-begonia-console.img.xz
            fastboot format:ext4 userdata
            fastboot flash boot boot-kupfer-begonia.img
            fastboot flash userdata rootfs-kupfer-begonia-console.img
            fastboot reboot
            ```

            **Login:** `alarm` / `alarm`
            **WiFi:** TP-Link WN821N (RTL8192EU) incluido
          prerelease: true
          makeLatest: true
          allowUpdates: true
          replacesArtifacts: true
          artifacts: release/*
