name: "01 — Fetch pmOS base"

on:
  workflow_dispatch:
    inputs:
      source_run:
        description: "Build # from begonia-postmarketos-build"
        default: "25"

env:
  PAT: ${{ secrets.PMOS_PAT }}

jobs:
  fetch:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            android-sdk-libsparse-utils \
            gdisk \
            --no-install-recommends

      - name: Download artifact
        run: |
          echo "${{ env.PAT }}" | gh auth login --with-token 2>/dev/null || true
          RUN_ID=$(gh run list --repo criollojoel10/begonia-postmarketos-build --limit 100 --json databaseId,number -q ".[] | select(.number == ${{ inputs.source_run }}) | .databaseId" | head -1)
          [ -z "$RUN_ID" ] && RUN_ID="${{ inputs.source_run }}"
          echo "Run ID: $RUN_ID"
          gh run download "$RUN_ID" \
            --repo criollojoel10/begonia-postmarketos-build \
            --name pmos-begonia-console-cross-true \
            --dir pmos-raw 2>&1
          cd pmos-raw && zip -r ../pmos.zip . && cd ..

      - name: Extract boot files
        run: |
          mkdir -p pmos out
          unzip -o pmos.zip -d pmos/
          EXDIR=$(find pmos -type d -name "export" | head -1)
          [ -z "$EXDIR" ] && EXDIR="pmos"

          cp "$EXDIR/boot.img" out/boot.img
          [ -f "$EXDIR/vmlinuz" ] && cp "$EXDIR/vmlinuz" out/vmlinuz
          for f in "$EXDIR/initramfs" "$EXDIR/initramfs.gz" "$EXDIR/initrd.img"; do
            [ -f "$f" ] && cp "$f" out/initramfs && break
          done
          echo "=== out/ ==="; ls -lh out/

      - name: Mount and extract modules + firmware
        run: |
          SYSIMG=$(find pmos -name "xiaomi-begonia.img" | head -1)
          echo "System image: $(ls -lh $SYSIMG)"

          # Convert sparse -> raw
          file "$SYSIMG" | grep -q "sparse" && simg2img "$SYSIMG" system-raw.img || cp "$SYSIMG" system-raw.img
          echo "Raw image: $(ls -lh system-raw.img)"

          # Method: Use sgdisk to get partition start sectors, then mount with offset
          echo "=== GPT Partition Table ==="
          sgdisk -p system-raw.img 2>&1 || true
          echo ""

          # Get partition start LBAs (sectors) from sgdisk
          # Format: Number  Start (sector)  End (sector)  Size  Code  Name
          # sgdisk -p doesn't parse well, use sgdisk -i instead or just awk
          # Extract partitions that are not empty
          
          # sgdisk --pretend --print gives stable format
          # We'll use a smarter approach: iterate partition numbers
          for PART_NUM in 1 2 3 4 5 6; do
            START=$(sgdisk -i $PART_NUM system-raw.img 2>/dev/null | grep "Partition start sector" | awk '{print $4}')
            [ -z "$START" ] && continue
            PART_NAME=$(sgdisk -i $PART_NUM system-raw.img 2>/dev/null | grep "Partition name" | cut -d"'" -f2)
            OFFSET=$((START * 512))
            echo ""
            echo "Partition $PART_NUM: '$PART_NAME' start_sector=$START offset=$OFFSET"
            
            mkdir -p mnt
            if sudo mount -o loop,ro,offset=$OFFSET system-raw.img mnt; then
              echo "Mounted! Contents: $(ls mnt/ 2>/dev/null | head -5)"
              
              if [ -d mnt/lib/modules ]; then
                KVER=$(ls mnt/lib/modules/ | head -1)
                echo "✅ FOUND kernel modules: $KVER"
                sudo tar -czf out/modules.tar.gz -C mnt/lib modules
                echo "   modules.tar.gz: $(ls -lh out/modules.tar.gz | awk '{print $5}') ($(tar -tzf out/modules.tar.gz | wc -l) files)"
              fi
              if [ -d mnt/lib/firmware ]; then
                echo "✅ FOUND firmware"
                sudo tar -czf out/firmware.tar.gz -C mnt/lib firmware
                echo "   firmware.tar.gz: $(ls -lh out/firmware.tar.gz | awk '{print $5}')"
              fi
              
              # Also grab the kernel version string for verification
              if [ -f mnt/usr/lib/os-release ]; then
                echo "OS: $(grep ^PRETTY_NAME mnt/usr/lib/os-release 2>/dev/null)"
              fi
              
              sudo umount mnt
            else
              echo "   Mount failed (expected if wrong fs type)"
            fi
          done

          echo ""
          echo "=== Final output ==="
          ls -lh out/

      - name: Verify content
        run: |
          echo "=== Final artifact contents ==="
          ls -lh out/
          echo ""
          echo "boot.img SHA256: $(sha256sum out/boot.img | cut -d' ' -f1)"
          echo ""
          if [ -f out/modules.tar.gz ]; then
            MOD_SIZE=$(ls -lh out/modules.tar.gz | awk '{print $5}')
            MOD_COUNT=$(tar -tzf out/modules.tar.gz | wc -l)
            echo "modules.tar.gz: $MOD_SIZE ($MOD_COUNT files)"
          else
            echo "❌ modules.tar.gz MISSING"
          fi
          if [ -f out/firmware.tar.gz ]; then
            echo "firmware.tar.gz: $(ls -lh out/firmware.tar.gz | awk '{print $5}')"
          else
            echo "❌ firmware.tar.gz MISSING"
          fi
          [ -f out/initramfs ] && echo "initramfs: $(ls -lh out/initramfs | awk '{print $5}')"

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: pmos-base-begonia
          path: out/
          retention-days: 90
