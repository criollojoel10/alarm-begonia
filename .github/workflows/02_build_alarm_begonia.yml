name: "02 — Build Arch Linux ARM begonia (corrected)"

on:
  workflow_dispatch:
    inputs:
      rootfs_size:
        description: "Rootfs image size (GB)"
        default: "8"

permissions:
  contents: write

env:
  ARCH_ROOTFS_URL: "http://os.archlinuxarm.org/os/ArchLinuxARM-aarch64-latest.tar.gz"
  RTL8192EU_REPO: "https://github.com/clnhub/rtl8192eu-linux.git"
  KERNEL_REPO: "https://gitlab.postmarketos.org/mt6785-mainline/linux.git"
  KERNEL_TAG: "6.16.4-r0"
  KERNEL_CONFIG_URL: "https://gitlab.postmarketos.org/postmarketOS/pmaports/-/raw/master/device/testing/linux-postmarketos-mediatek-mt6785/config-postmarketos-mediatek-mt6785.aarch64"
  CACHE_KEY_KERNEL: "v1-kernel-6.16.4-r0"

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4

      - name: Install deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            libarchive-tools xz-utils zstd e2fsprogs \
            qemu-user-static binfmt-support \
            gcc-aarch64-linux-gnu python3 \
            --no-install-recommends

      # ============================================================
      # Use pmOS base from workflow 01
      # boot.img = pmOS original (vendor kernel + DTB + pmOS initramfs)
      # modules/firmware = pmOS kernel modules
      # ============================================================
      - name: Download pmOS base
        uses: dawidd6/action-download-artifact@v9
        with:
          name: pmos-base-begonia
          path: pmos-base
          workflow: 01_build_pmos_base.yml
          workflow_conclusion: success
          workflow_search: true
          check_artifacts: true
          repo: criollojoel10/alarm-begonia

      - name: Download Arch rootfs
        run: |
          wget -q --show-progress "${{ env.ARCH_ROOTFS_URL }}" -O arch-rootfs.tar.gz
          ls -lh arch-rootfs.tar.gz

      # ============================================================
      # FIX CRÍTICO #1: Remover UUIDs stale del cmdline
      # El boot.img de pmOS tiene UUIDs hardcodeados del build #25.
      # find_partition() chequea UUID primero: si existe pero no coincide
      # RETORNA VACÍO (no cae a label). Con UUIDs removidos, cae a label.
      # ============================================================
      - name: Fix boot.img cmdline (remove stale UUIDs)
        run: python3 scripts/fix-cmdline.py

      - name: Create and mount rootfs image
        run: |
          truncate -s ${{ inputs.rootfs_size }}G rootfs.img
          mkfs.ext4 -F -L pmOS_root rootfs.img
          mkdir -p mnt
          sudo mount rootfs.img mnt

      - name: Extract Arch rootfs + inject modules/firmware
        run: |
          sudo bsdtar -xpf arch-rootfs.tar.gz -C mnt
          sudo mkdir -p mnt/usr/lib
          sudo tar -xzf pmos-base/modules.tar.gz -C mnt/usr/lib/
          sudo tar -xzf pmos-base/firmware.tar.gz -C mnt/usr/lib/ 2>/dev/null || true
          KVER=$(ls mnt/usr/lib/modules/ | head -1)
          echo "Kernel: $KVER"
          echo "Modules: $(find mnt/usr/lib/modules -type f | wc -l)"
          echo "KVER=$KVER" >> $GITHUB_ENV

      # ============================================================
      # Build RTL8192EU (TP-Link WN821N) WiFi driver
      # ============================================================
      - name: Restore kernel source cache
        id: cache-kernel
        uses: actions/cache@v4
        with:
          path: linux-kernel
          key: ${{ env.CACHE_KEY_KERNEL }}
          restore-keys: |
            v1-kernel-

      - name: Clone kernel source (shallow, tag ${{ env.KERNEL_TAG }})
        if: steps.cache-kernel.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --branch ${{ env.KERNEL_TAG }} \
            ${{ env.KERNEL_REPO }} linux-kernel 2>&1 | tail -3

      - name: Prepare kernel build tree
        run: |
          wget -q "${{ env.KERNEL_CONFIG_URL }}" -O linux-kernel/.config
          cd linux-kernel
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- olddefconfig 2>&1 | tail -3
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- modules_prepare 2>&1 | tail -5

      - name: Build RTL8192EU driver
        run: |
          git clone --depth 1 ${{ env.RTL8192EU_REPO }} rtl8192eu-linux
          cd rtl8192eu-linux
          KSRC="${{ github.workspace }}/linux-kernel"
          sed -i 's/CONFIG_PLATFORM_I386_PC = y/CONFIG_PLATFORM_I386_PC = n/' Makefile
          sed -i 's/CONFIG_PLATFORM_ARM_AARCH64 = n/CONFIG_PLATFORM_ARM_AARCH64 = y/' Makefile
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- \
            KSRC="$KSRC" KBUILD_MODPOST_WARN=1 2>&1 | tail -30
          ls -lh 8192eu.ko 2>/dev/null || { ls *.ko; false; }

      - name: Install WiFi driver to rootfs
        run: |
          KVER=$(ls mnt/usr/lib/modules/ | head -1)
          MODDIR="mnt/usr/lib/modules/$KVER/extra"
          sudo mkdir -p "$MODDIR"
          sudo cp rtl8192eu-linux/8192eu.ko "$MODDIR/"
          sudo depmod -b mnt "$KVER"

          sudo mkdir -p mnt/etc/modprobe.d mnt/etc/modules-load.d
          printf '%s\n' \
            'blacklist rtl8xxxu' \
            'options 8192eu rtw_power_mgnt=0 rtw_enusbss=0' \
            | sudo tee mnt/etc/modprobe.d/rtl8192eu.conf > /dev/null
          echo '8192eu' | sudo tee mnt/etc/modules-load.d/rtl8192eu.conf > /dev/null

      # ============================================================
      # Chroot setup
      # ============================================================
      - name: Prepare chroot
        run: |
          sudo cp "$(which qemu-aarch64-static)" mnt/usr/bin/
          sudo mount -t proc proc mnt/proc
          sudo mount --bind /sys mnt/sys
          sudo mount --bind /dev mnt/dev
          sudo mount --bind /dev/pts mnt/dev/pts 2>/dev/null || true
          sudo rm -f mnt/etc/resolv.conf
          sudo bash -c 'cp /etc/resolv.conf mnt/etc/resolv.conf'
          sudo cp pmos-base/vmlinuz mnt/boot/vmlinuz-linux 2>/dev/null || true
          sudo sed -i '/\[options\]/a DisableSandbox' mnt/etc/pacman.conf 2>/dev/null || true

      - name: Install packages (pacman in chroot)
        run: |
          sudo chroot mnt /bin/bash -c '
            pacman-key --init 2>&1
            pacman-key --populate archlinuxarm 2>&1
            pacman -Syu --noconfirm --needed \
              busybox \
              sudo vim nano git openssh rsync curl wget \
              networkmanager iwd wpa_supplicant \
              htop tmux 2>&1
          '

      # ============================================================
      # FIX CRÍTICO #2: /etc/fstab — previene wait_boot_partition
      # El pmOS initramfs (stage 2) verifica si fstab está vacío.
      # Si lo está, llama wait_boot_partition() que busca label
      # "pmOS_boot" por 30s y falla. Con fstab válido, lo skipea.
      # ============================================================
      - name: Create /etc/fstab
        run: |
          printf '%s\n' \
            '# /etc/fstab — Arch Linux ARM on begonia' \
            '' \
            'LABEL=pmOS_root  /  ext4  rw,noatime,nodiratime,data=ordered  0 1' \
            'tmpfs  /tmp  tmpfs  rw,nosuid,nodev,noexec,mode=1777  0 0' \
            | sudo tee mnt/etc/fstab > /dev/null
          cat mnt/etc/fstab

      # ============================================================
      # NO mkinitcpio — NO repack boot.img
      # El initramfs de pmOS sabe buscar pmOS_root por label.
      # El boot.img se usa tal cual (con cmdline sin UUIDs stale).
      # ============================================================

      - name: Prepare boot.img for release
        run: |
          cp pmos-base/boot.img boot-begonia-arch.img
          echo "Using pmOS boot.img (with pmOS initramfs):"
          ls -lh boot-begonia-arch.img
          python3 -c "
          import struct
          with open('boot-begonia-arch.img', 'rb') as f:
            data = f.read(1648)
          c = data[64:576].rstrip(b'\x00').decode('ascii', 'replace')
          print('Cmdline:')
          print(c)
          print()
          print('UUIDs stale:', 'pmos_root_uuid=' in c or 'pmos_boot_uuid=' in c)
          print('root= present:', 'root=' in c)
          "

      - name: Enable services & create user
        run: |
          sudo chroot mnt /bin/bash -c '
            systemctl set-default multi-user.target
            systemctl enable sshd
            systemctl enable NetworkManager
            systemctl enable systemd-timesyncd
            useradd -m -s /bin/bash alarm 2>/dev/null || true
            echo "alarm:alarm" | chpasswd
            usermod -aG wheel alarm 2>/dev/null || true
            sed -i "s/# %wheel ALL=(ALL:ALL) ALL/%wheel ALL=(ALL:ALL) ALL/" /etc/sudoers
            echo "PermitRootLogin yes" >> /etc/ssh/sshd_config
          '

      - name: Cleanup & release
        run: |
          sudo umount mnt/dev/pts 2>/dev/null || true
          sudo umount mnt/dev 2>/dev/null || true
          sudo umount mnt/sys 2>/dev/null || true
          sudo umount mnt/proc 2>/dev/null || true
          sudo umount mnt 2>/dev/null || true

          mkdir -p release
          mv boot-begonia-arch.img release/
          xz -9 -T 0 -f rootfs.img
          mv rootfs.img.xz release/rootfs-archlinuxarm-begonia-console.img.xz
          [ -f flash/flash-begonia-arch.sh ] && cp flash/flash-begonia-arch.sh release/
          cd release && sha256sum * > SHA256SUMS.txt && ls -lh && cd ..

      - name: Create/Update Release
        uses: ncipollo/release-action@v1
        with:
          tag: nightly
          name: "Arch Linux ARM for begonia (nightly)"
          body: |
            ## Arch Linux ARM for Xiaomi Redmi Note 8 Pro (begonia)

            **CORREGIDO:** Ya no se queda en "waiting for boot partition".

            ### Qué cambió respecto al build #19 (que fallaba)

            | Build #19 (fallaba) | Build #22 ✅ |
            |---|---|
            | UUIDs stale en cmdline → find_partition() retorna vacío | UUIDs removidos → cae a label `pmOS_root` |
            | No existía /etc/fstab → wait_boot_partition() 30s → crash | /etc/fstab creado → skip boot partition |
            | Boot.img = pmOS initramfs | **Mismo** pmOS initramfs (no se reemplazó) |
            | Sin WiFi | RTL8192EU incluido |

            ### Flujo de boot
            ```
            Bootloader → kernel pmOS 6.16.4 → pmOS initramfs
            → busca pmOS_root por label ✅
            → monta rootfs → verifica fstab (OK, no busca boot) 
            → switch_root → systemd de Arch Linux ARM 🚀
            ```

            **Kernel:** postmarketOS mainline 6.16.4 (ext4/mmc built-in)
            **Initramfs:** pmOS original (NO mkinitcpio)
            **Userspace:** Arch Linux ARM aarch64 (glibc, pacman, systemd)

            ### Install
            ```
            xz -d rootfs-archlinuxarm-begonia-console.img.xz
            fastboot format:ext4 userdata
            fastboot flash boot boot-begonia-arch.img
            fastboot flash userdata rootfs-archlinuxarm-begonia-console.img
            fastboot reboot
            ```

            **Login:** `alarm` / `alarm`
          prerelease: true
          makeLatest: true
          allowUpdates: true
          replacesArtifacts: true
          artifacts: release/*
