name: "01 — Fetch pmOS base"

on:
  workflow_dispatch:
    inputs:
      artifact_url:
        description: "URL to pmos-begonia-console-cross-true artifact zip"
        default: ""
      source_run:
        description: "Build # from begonia-postmarketos-build (auto-download)"
        default: "25"

env:
  PAT: ${{ secrets.PMOS_PAT }}

jobs:
  fetch:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            android-sdk-platform-tools-common \
            e2fsprogs f2fs-tools \
            --no-install-recommends

      - name: Download artifact
        run: |
          if [ -n "${{ inputs.artifact_url }}" ]; then
            echo "Downloading from provided URL..."
            curl -sL -o pmos.zip "${{ inputs.artifact_url }}"
          elif [ -n "${{ env.PAT }}" ]; then
            echo "Auto-downloading from run #${{ inputs.source_run }}..."
            # Use gh (pre-installed on runner) with PAT
            echo "${{ env.PAT }}" | gh auth login --with-token 2>/dev/null || true
            gh run download ${{ inputs.source_run }} \
              --repo criollojoel10/begonia-postmarketos-build \
              --name pmos-begonia-console-cross-true \
              --dir pmos-raw 2>&1
            cd pmos-raw && zip -r ../pmos.zip . && cd ..
          else
            echo "ERROR: provide artifact_url input or set PMOS_PAT secret"
            echo ""
            echo "How to get the artifact URL:"
            echo "1. Go to https://github.com/criollojoel10/begonia-postmarketos-build/actions/runs/28313265908"
            echo "2. Download 'pmos-begonia-console-cross-true' manually"
            echo "3. Upload to any public file host and pass URL, OR"
            echo "4. Create a PAT with 'repo' scope, save as repo secret PMOS_PAT"
            exit 1
          fi
          ls -lh pmos.zip
          unzip -l pmos.zip | head -15

      - name: Extract boot.img
        run: |
          mkdir -p pmos out
          unzip -o pmos.zip -d pmos/
          BOOT=$(find pmos -name "boot.img" | head -1)
          if [ -n "$BOOT" ]; then
            cp "$BOOT" out/boot.img
            echo "boot.img: $(ls -lh out/boot.img)"
          fi
          VMLINUZ=$(find pmos -name "vmlinuz" | head -1)
          if [ -n "$VMLINUZ" ]; then
            cp "$VMLINUZ" out/vmlinuz
          fi

      - name: Mount and extract modules + firmware
        run: |
          SYSIMG=$(find pmos -name "xiaomi-begonia.img" | head -1)
          if [ -z "$SYSIMG" ]; then
            echo "ERROR: no system image found"
            find pmos -type f -exec ls -lh {} \;
            exit 1
          fi
          echo "System image: $(ls -lh $SYSIMG)"
          
          # Convert sparse to raw
          file "$SYSIMG" | grep -q "sparse" && simg2img "$SYSIMG" system-raw.img || cp "$SYSIMG" system-raw.img
          ls -lh system-raw.img
          
          # Use kpartx to find partitions
          LOOP=$(sudo losetup --find --show -r system-raw.img)
          echo "Loop: $LOOP"
          sudo kpartx -av "$LOOP" 2>&1 || true
          
          # Mount each partition
          for part in /dev/mapper/loop*p*; do
            [ -b "$part" ] || continue
            echo "Trying $part..."
            mkdir -p mnt
            sudo mount -r "$part" mnt 2>/dev/null || continue
            
            if [ -d mnt/lib/modules ]; then
              KVER=$(ls mnt/lib/modules/ | head -1)
              echo "Found modules: $KVER"
              sudo tar -czf out/modules.tar.gz -C mnt/lib modules
              ls -lh out/modules.tar.gz
            fi
            if [ -d mnt/lib/firmware ]; then
              sudo tar -czf out/firmware.tar.gz -C mnt/lib firmware
              ls -lh out/firmware.tar.gz
            fi
            sudo umount mnt
            break
          done
          
          # Cleanup
          sudo kpartx -d "$LOOP" 2>/dev/null || true
          sudo losetup -d "$LOOP" 2>/dev/null || true
          
          echo ""
          echo "=== Final output ==="
          ls -lh out/

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: pmos-base-begonia
          path: out/
          retention-days: 90
