name: "02 — Build Arch Linux ARM begonia"

on:
  workflow_dispatch:
    inputs:
      rootfs_size:
        description: "Rootfs image size (GB)"
        default: "8"

permissions:
  contents: write

env:
  ARCH_ROOTFS_URL: "http://os.archlinuxarm.org/os/ArchLinuxARM-aarch64-latest.tar.gz"
  IMAGE_SIZE: "${{ inputs.rootfs_size }}G"

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4

      - name: Install deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            libarchive-tools cpio xz-utils zstd e2fsprogs \
            qemu-user-static binfmt-support systemd-container \
            --no-install-recommends

      - name: Download pmOS base (from 01)
        uses: dawidd6/action-download-artifact@v9
        with:
          name: pmos-base-begonia
          path: pmos-base
          workflow: 01_build_pmos_base.yml
          workflow_conclusion: success
          workflow_search: true
          check_artifacts: true
          repo: criollojoel10/alarm-begonia

      - name: Verify pmOS base
        run: |
          ls -lh pmos-base/
          file pmos-base/boot.img
          [ -f pmos-base/modules.tar.gz ] && echo "✅ modules"
          [ -f pmos-base/firmware.tar.gz ] && echo "✅ firmware"

      - name: Download Arch rootfs
        run: |
          wget -q --show-progress "${{ env.ARCH_ROOTFS_URL }}" -O arch-rootfs.tar.gz
          ls -lh arch-rootfs.tar.gz

      - name: Create and mount rootfs image (labeled pmOS_ROOT for initramfs compat)
        run: |
          truncate -s ${{ env.IMAGE_SIZE }} rootfs.img
          mkfs.ext4 -F -L pmOS_ROOT rootfs.img
          mkdir -p mnt
          sudo mount rootfs.img mnt
          df -h mnt

      - name: Extract Arch rootfs
        run: |
          sudo bsdtar -xpf arch-rootfs.tar.gz -C mnt
          sudo sync
          echo "Used: $(df -h mnt | tail -1 | awk '{print $3}')"

      - name: Inject kernel modules
        run: |
          if [ -f pmos-base/modules.tar.gz ]; then
            sudo mkdir -p mnt/usr/lib
            sudo tar -xzf pmos-base/modules.tar.gz -C mnt/usr/lib/
            KVER=$(ls mnt/usr/lib/modules/ | head -1)
            echo "✅ $KVER ($(find mnt/usr/lib/modules -type f | wc -l) files)"
          fi

      - name: Inject firmware
        run: |
          if [ -f pmos-base/firmware.tar.gz ]; then
            sudo mkdir -p mnt/usr/lib
            sudo tar -xzf pmos-base/firmware.tar.gz -C mnt/usr/lib/
            echo "✅ $(find mnt/usr/lib/firmware -type f | wc -l) files"
          fi

      - name: Configure rootfs
        run: |
          sudo mkdir -p mnt/etc
          echo "nameserver 1.1.1.1" | sudo tee mnt/etc/resolv.conf
          echo "nameserver 8.8.8.8" | sudo tee -a mnt/etc/resolv.conf

      - name: Install base packages + mkinitcpio
        run: |
          sudo systemd-nspawn -D mnt --pipe sh -c '
            pacman-key --init 2>&1 | tail -1
            pacman-key --populate archlinuxarm 2>&1 | tail -1
            pacman -Syu --noconfirm --needed \
              mkinitcpio busybox \
              sudo vim nano git openssh rsync curl wget \
              networkmanager systemd-resolved \
              htop tmux 2>&1 | tail -5
          ' 2>&1 || echo "⚠️ pacman had issues"

      - name: Generate Arch initramfs (mkinitcpio)
        run: |
          KVER=$(ls mnt/usr/lib/modules/ | head -1)
          if [ -z "$KVER" ]; then
            echo "No kernel modules found, skipping mkinitcpio"
            exit 0
          fi
          echo "Kernel: $KVER"
          
          sudo systemd-nspawn -D mnt --pipe sh -c "
            mkinitcpio -k '$KVER' -g /boot/initramfs-arch.img 2>&1
          " 2>&1 | tail -20 || true
          
          if [ -f mnt/boot/initramfs-arch.img ]; then
            echo "✅ Arch initramfs: $(ls -lh mnt/boot/initramfs-arch.img | awk '{print $5}')"
          fi

      - name: Enable services & create user
        run: |
          sudo systemd-nspawn -D mnt --pipe sh -c '
            systemctl set-default multi-user.target
            systemctl enable sshd
            systemctl enable NetworkManager
            systemctl enable systemd-resolved
            systemctl enable systemd-timesyncd
            useradd -m -s /bin/bash alarm 2>/dev/null || true
            echo "alarm:alarm" | chpasswd
            usermod -aG wheel alarm 2>/dev/null || true
            sed -i "s/# %wheel ALL=(ALL:ALL) ALL/%wheel ALL=(ALL:ALL) ALL/" /etc/sudoers
            echo "PermitRootLogin yes" >> /etc/ssh/sshd_config
          ' 2>&1 | tail -10 || true

      - name: Prepare release
        run: |
          mkdir -p release
          
          # Use pmOS boot.img — its embedded initramfs auto-detects pmOS_ROOT label
          # And will switch_root to Arch systemd
          cp pmos-base/boot.img release/boot-begonia-arch.img
          echo "boot.img: $(ls -lh release/boot-begonia-arch.img | awk '{print $5}')"
          
          # If mkinitcpio generated an Arch initramfs, also pack it separately
          if [ -f mnt/boot/initramfs-arch.img ]; then
            cp mnt/boot/initramfs-arch.img release/initramfs-arch.img
            echo "Extra: initramfs-arch.img"
          fi
          
          sudo umount mnt 2>/dev/null || true
          echo "Compressing rootfs.img with xz..."
          xz -9 -T 0 -f rootfs.img && ls -lh rootfs.img.xz
          mv rootfs.img.xz release/rootfs-archlinuxarm-begonia-console.img.xz
          
          if [ -f flash/flash-begonia-arch.sh ]; then
            cp flash/flash-begonia-arch.sh release/
          fi
          
          cd release
          sha256sum * > SHA256SUMS.txt
          ls -lh
          cd ..

      - name: Create/Update Release
        uses: ncipollo/release-action@v1
        with:
          tag: nightly
          name: "Arch Linux ARM for begonia (nightly)"
          body: |
            ## Arch Linux ARM for Xiaomi Redmi Note 8 Pro (begonia)

            - **Kernel:** postmarketOS mainline 6.16.4
            - **Initramfs:** nativo de Arch (mkinitcpio)
            - **Userspace:** Arch Linux ARM aarch64 (glibc, pacman, systemd)
            - **Modules:** mt6785 mainline (6.16.4)
            - **Firmware:** WiFi, GPU, etc.

            ### Files
            - `boot-begonia-arch.img` — Kernel + DTB + initramfs
            - `rootfs-archlinuxarm-begonia-console.img.xz` — Rootfs ext4
            - `initramfs-arch.img` — initramfs opcional
            - `flash-begonia-arch.sh` — Script de flasheo

            ### Install
            ```
            # Device must be in fastboot mode first
            fastboot format:ext4 userdata
            fastboot flash boot boot-begonia-arch.img
            fastboot flash userdata rootfs-archlinuxarm-begonia-console.img
            fastboot reboot
            ```

            **Login:** `alarm` / `alarm`
            **SSH:** `ssh alarm@<device-ip>`
          prerelease: true
          makeLatest: true
          allowUpdates: true
          replacesArtifacts: true
          artifacts: release/*
