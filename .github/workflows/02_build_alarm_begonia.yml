name: "02 — Build Arch Linux ARM begonia"

on:
  workflow_dispatch:
    inputs:
      rootfs_size:
        description: "Rootfs image size (GB)"
        default: "8"

env:
  ARCH_ROOTFS_URL: "http://os.archlinuxarm.org/os/ArchLinuxARM-aarch64-latest.tar.gz"
  IMAGE_SIZE: "${{ inputs.rootfs_size }}G"

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4

      - name: Download pmOS base (from 01)
        uses: dawidd6/action-download-artifact@v9
        with:
          name: pmos-base-begonia
          path: pmos-base
          workflow: 01_build_pmos_base.yml
          workflow_conclusion: success
          workflow_search: true
          check_artifacts: true
          repo: criollojoel10/alarm-begonia

      - name: Verify pmOS base
        run: |
          ls -lh pmos-base/
          file pmos-base/boot.img 2>/dev/null || echo "No boot.img!"

      - name: Install deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            libarchive-tools cpio xz-utils zstd e2fsprogs \
            qemu-user-static binfmt-support \
            --no-install-recommends

      - name: Download Arch rootfs
        run: |
          wget -q --show-progress "${{ env.ARCH_ROOTFS_URL }}" -O arch-rootfs.tar.gz
          ls -lh arch-rootfs.tar.gz

      - name: Create and mount rootfs image
        run: |
          truncate -s ${{ env.IMAGE_SIZE }} rootfs.img
          mkfs.ext4 -F -L ArchRoot rootfs.img
          mkdir -p mnt
          sudo mount rootfs.img mnt
          df -h mnt

      - name: Extract Arch rootfs
        run: |
          sudo bsdtar -xpf arch-rootfs.tar.gz -C mnt
          sudo sync

      - name: Inject kernel modules
        run: |
          if [ -f pmos-base/modules.tar.gz ]; then
            # tar contains modules/6.16.4/... — extract to /usr/lib
            sudo mkdir -p mnt/usr/lib
            sudo tar -xzf pmos-base/modules.tar.gz -C mnt/usr/lib/
            echo "Modules injected:"
            ls -R mnt/usr/lib/modules/ 2>/dev/null | head -10
          elif [ -d pmos-base/modules ]; then
            KVER=$(ls pmos-base/modules/ | head -1)
            if [ -n "$KVER" ]; then
              sudo mkdir -p mnt/usr/lib/modules/$KVER
              sudo cp -a pmos-base/modules/$KVER/* mnt/usr/lib/modules/$KVER/
              echo "Modules injected: $KVER"
            fi
          fi

      - name: Inject firmware
        run: |
          if [ -f pmos-base/firmware.tar.gz ]; then
            # tar contains firmware/ — extract to /usr/lib
            sudo mkdir -p mnt/usr/lib
            sudo tar -xzf pmos-base/firmware.tar.gz -C mnt/usr/lib/
            echo "Firmware injected:"
            ls -R mnt/usr/lib/firmware/ 2>/dev/null | head -10
          fi

      - name: Configure rootfs
        run: |
          sudo mkdir -p mnt/etc
          echo "nameserver 1.1.1.1" | sudo tee mnt/etc/resolv.conf
          echo "nameserver 8.8.8.8" | sudo tee -a mnt/etc/resolv.conf
          
          sudo systemd-nspawn -D mnt --pipe sh -c '
            pacman-key --init && pacman-key --populate archlinuxarm
          ' 2>&1 | tail -5 || true

      - name: Install packages
        run: |
          sudo systemd-nspawn -D mnt --pipe sh -c '
            pacman -Syu --noconfirm --needed \
              sudo vim nano git openssh rsync curl wget \
              networkmanager systemd-resolved \
              htop tmux \
              2>&1
          ' 2>&1 | tail -20 || true

      - name: Enable services & create user
        run: |
          sudo systemd-nspawn -D mnt --pipe sh -c '
            systemctl set-default multi-user.target
            systemctl enable sshd
            systemctl enable NetworkManager
            systemctl enable systemd-resolved
            systemctl enable systemd-timesyncd
            useradd -m -s /bin/bash alarm 2>/dev/null || true
            echo "alarm:alarm" | chpasswd
            usermod -aG wheel alarm 2>/dev/null || true
            sed -i "s/# %wheel ALL=(ALL:ALL) ALL/%wheel ALL=(ALL:ALL) ALL/" /etc/sudoers
            echo "PermitRootLogin yes" >> /etc/ssh/sshd_config
          ' 2>&1 | tail -10 || true

      - name: Build Arch initramfs
        run: |
          if [ -f initramfs/init ]; then
            mkdir -p initramfs-work
            cp initramfs/init initramfs-work/init
            
            if [ -f initramfs/files.list ]; then
              while IFS= read -r f; do
                [ -z "$f" ] && continue
                sudo cp -aL "mnt/$f" initramfs-work/ 2>/dev/null || true
              done < initramfs/files.list
            fi
            
            cd initramfs-work
            find . -print0 | cpio --null --create --format=newc | gzip -9 > ../arch-initramfs.gz
            cd ..
            ls -lh arch-initramfs.gz
          fi

      - name: Repack boot.img
        run: |
          if [ -f boot/repack-bootimg.sh ]; then
            chmod +x boot/repack-bootimg.sh
            if [ -f arch-initramfs.gz ]; then
              bash boot/repack-bootimg.sh pmos-base/boot.img arch-initramfs.gz boot-begonia-arch.img
            else
              cp pmos-base/boot.img boot-begonia-arch.img
            fi
          else
            cp pmos-base/boot.img boot-begonia-arch.img
          fi
          ls -lh boot-begonia-arch.img

      - name: Prepare release
        run: |
          mkdir -p release
          cp boot-begonia-arch.img release/
          
          sudo umount mnt 2>/dev/null || true
          xz -9 -T 0 -f rootfs.img && ls -lh rootfs.img.xz
          mv rootfs.img.xz release/rootfs-archlinuxarm-begonia-console.img.xz
          
          if [ -f flash/flash-begonia-arch.sh ]; then
            cp flash/flash-begonia-arch.sh release/
          fi
          
          cd release
          sha256sum * > SHA256SUMS.txt
          ls -lh
          cd ..

      - name: Delete old nightly release
        run: |
          # Delete existing nightly release + tag to avoid conflict
          gh release delete nightly -y --repo ${{ github.repository }} 2>/dev/null || true
          git push --delete origin nightly 2>/dev/null || true
          sleep 2

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nightly
          name: "Arch Linux ARM for begonia (nightly)"
          body: |
            ## Arch Linux ARM for Xiaomi Redmi Note 8 Pro (begonia)
            
            Basado en:
            - Kernel: postmarketOS mainline 6.16.4
            - Userspace: Arch Linux ARM aarch64 (glibc)
            
            **Qué incluye:**
            - `boot-begonia-arch.img` — flash con `fastboot flash boot`
            - `rootfs-archlinuxarm-begonia-console.img.xz` — flash con `fastboot flash userdata`
            - `flash-begonia-arch.sh` — script todo-en-uno
            
            **Instalación:**
            ```
            unxz rootfs-archlinuxarm-begonia-console.img.xz
            fastboot flash boot boot-begonia-arch.img
            fastboot flash userdata rootfs-archlinuxarm-begonia-console.img
            fastboot reboot
            ```
            
            Usuario: `alarm` / `alarm`
            SSH: `ssh alarm@<ip>` (averigua IP desde el router o consola serial)
          prerelease: true
          make_latest: true
          files: release/*
          fail_on_unmatched_files: false
