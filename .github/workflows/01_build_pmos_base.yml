name: "01 — Fetch pmOS base"

on:
  workflow_dispatch:
    inputs:
      artifact_url:
        description: "Direct download URL (skip PAT)"
        default: ""
      source_run:
        description: "Build # from begonia-postmarketos-build"
        default: "25"

env:
  PAT: ${{ secrets.PMOS_PAT }}

jobs:
  fetch:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            android-sdk-libsparse-utils \
            --no-install-recommends

      - name: Download artifact
        run: |
          if [ -n "${{ inputs.artifact_url }}" ]; then
            echo "Downloading from provided URL..."
            curl -sL -o pmos.zip "${{ inputs.artifact_url }}"
          elif [ -n "${{ env.PAT }}" ]; then
            echo "Auto-downloading from run #${{ inputs.source_run }}..."
            echo "${{ env.PAT }}" | gh auth login --with-token 2>/dev/null || true
            RUN_ID=$(gh run list --repo criollojoel10/begonia-postmarketos-build --limit 100 --json databaseId,number -q ".[] | select(.number == ${{ inputs.source_run }}) | .databaseId" | head -1)
            [ -z "$RUN_ID" ] && RUN_ID="${{ inputs.source_run }}"
            echo "Run database ID: $RUN_ID"
            gh run download "$RUN_ID" \
              --repo criollojoel10/begonia-postmarketos-build \
              --name pmos-begonia-console-cross-true \
              --dir pmos-raw 2>&1
            cd pmos-raw && zip -r ../pmos.zip . && cd ..
          else
            echo "ERROR: no PMOS_PAT set. Create a PAT with actions:read scope."
            exit 1
          fi

      - name: Extract files
        run: |
          mkdir -p pmos out
          unzip -o pmos.zip -d pmos/
          EXDIR=$(find pmos -type d -name "export" | head -1)
          [ -z "$EXDIR" ] && EXDIR="pmos"
          echo "Source: $EXDIR"
          [ -f "$EXDIR/boot.img" ] && cp "$EXDIR/boot.img" out/boot.img && file out/boot.img
          [ -f "$EXDIR/vmlinuz" ] && cp "$EXDIR/vmlinuz" out/vmlinuz
          for f in "$EXDIR/initramfs" "$EXDIR/initramfs.gz" "$EXDIR/initrd.img"; do
            [ -f "$f" ] && cp "$f" out/initramfs && break
          done
          echo "out/:"; ls -lh out/

      - name: Mount and extract modules + firmware
        run: |
          # xiaomi-begonia.img is a FULL DISK IMAGE (partitioned)
          SYSIMG=$(find pmos -name "xiaomi-begonia.img" | head -1)
          if [ -z "$SYSIMG" ]; then ls pmos/; exit 1; fi
          echo "System image: $(ls -lh $SYSIMG)"

          # Convert sparse -> raw
          file "$SYSIMG" | grep -q "sparse" && simg2img "$SYSIMG" system-raw.img || cp "$SYSIMG" system-raw.img
          ls -lh system-raw.img

          # Show partitions
          fdisk -l system-raw.img 2>/dev/null || echo "No fdisk output"

          # losetup -P creates partition devices
          LOOP=$(sudo losetup -P -f --show -r system-raw.img)
          echo "Loop: $LOOP"
          ls -la ${LOOP}p* 2>/dev/null || echo "No partition nodes created"

          FOUND=0
          for part in ${LOOP}p*; do
            [ -b "$part" ] || continue
            echo "--- Mounting $part ---"
            mkdir -p mnt
            sudo mount -r "$part" mnt 2>/dev/null || { echo "mount failed"; continue; }
            echo "mnt/: $(ls mnt/ 2>/dev/null | head -5)"

            if [ -d mnt/lib/modules ]; then
              KVER=$(ls mnt/lib/modules/ | head -1)
              echo "FOUND modules: $KVER"
              sudo tar -czf out/modules.tar.gz -C mnt/lib modules
              ls -lh out/modules.tar.gz
              FOUND=1
            fi
            if [ -d mnt/lib/firmware ]; then
              echo "FOUND firmware"
              sudo tar -czf out/firmware.tar.gz -C mnt/lib firmware
              ls -lh out/firmware.tar.gz
              FOUND=1
            fi
            sudo umount mnt
          done

          if [ "$FOUND" = "0" ]; then
            echo "ERROR: No modules/firmware found!"
            for part in ${LOOP}p*; do
              [ -b "$part" ] || continue
              mkdir -p m && sudo mount -r "$part" m 2>/dev/null && echo "--- $part ---" && ls m/ 2>/dev/null && sudo umount m || true
            done
          fi

          sudo losetup -d "$LOOP" 2>/dev/null || true
          echo "=== out/ ==="; ls -lh out/

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: pmos-base-begonia
          path: out/
          retention-days: 90
